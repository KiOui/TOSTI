<svg class="wrapped-illustration wrapped-tower" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <ellipse class="wrapped-plate" cx="100" cy="191" rx="80" ry="7"></ellipse>
    {% for tosti in data.stack %}
        <g transform="translate(40 {{ tosti.y }})">
            <g class="wrapped-tosti" style="--i: {{ tosti.index }}">
                <rect class="wrapped-bread" x="0" y="9" width="120" height="7" rx="3"></rect>
                <path class="wrapped-cheese" d="M4 8h112v3c-3 0-3 4-7 4s-4-4-7-4H52c-3 0-3 5-6 5s-3-5-6-5H4z"></path>
                <rect class="wrapped-bread wrapped-bread-top" x="0" y="0" width="120" height="9" rx="4"></rect>
                <path class="wrapped-grill" d="M24 2.5l9 4M52 2.5l9 4M80 2.5l9 4"></path>
            </g>
        </g>
    {% endfor %}
    {% if data.clouds %}
        {# The tower is too tall to draw: it disappears in the clouds. #}
        <line class="wrapped-tower-continues" x1="100" y1="36" x2="100" y2="26"></line>
        <g class="wrapped-cloud">
            <circle cx="86" cy="16" r="8"></circle>
            <circle cx="100" cy="11" r="10"></circle>
            <circle cx="114" cy="16" r="8"></circle>
            <rect x="78" y="15" width="44" height="9" rx="4.5"></rect>
        </g>
    {% endif %}
</svg>
